# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: studify
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Optional: paste an Anthropic API key in the Render dashboard to enable AI-written notes.
      - key: ANTHROPIC_API_KEY
        sync: false
